<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product | StyleSync</title>

    <link rel="stylesheet" href="product.css">
</head>

<body>

    <header class="navbar">

        <div class="logo">StyleSync</div>

        <nav>
            <a href="index.html">Home</a>
            <a href="shop.html">Shop</a>
            <a href="#">Looks</a>
            <a href="#">Try-On</a>
        </nav>

        <div class="nav-actions">
            <a href="#">♡</a>
            <a href="#">🛒</a>
            <a href="login.html">Login</a>
        </div>

    </header>


    <main>

        <section class="product-detail">

            <div class="product-detail-image">
                <img src="images/casual.jpg" alt="Everyday Essential Look">
            </div>


            <div class="product-detail-info">

                <p class="product-label">CASUAL EDIT</p>

                <h1>Everyday Essential Look</h1>

                <p class="product-price">₹2,499</p>

                <p class="product-description">
                    A relaxed everyday look curated with modern essentials
                    for an effortless style.
                </p>


                <div class="size-section">

                    <h3>Select Size</h3>

                    <div class="sizes">
                        <button>XS</button>
                        <button>S</button>
                        <button>M</button>
                        <button>L</button>
                        <button>XL</button>
                    </div>

                </div>


                <button class="add-cart">Add to Cart</button>

                <button class="try-on">Try It On</button>

            </div>

        </section>

    </main>
<script src="product.js"></script>
</body>

</html>
